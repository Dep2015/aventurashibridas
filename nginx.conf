server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # solo los .js/.css de Vite llevan hash en el nombre: se pueden cachear mucho tiempo
  # (los sprites de public/assets/ no llevan hash y usan la caché normal)
  location ~ ^/assets/[^/]+\.(js|css)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
